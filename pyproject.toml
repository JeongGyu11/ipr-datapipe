[project]
name = "insurance-document-crawler"
version = "0.1.0"
description = "보험사 상품공시 문서 자동 수집기"
requires-python = ">=3.12,<3.13"
dependencies = [
    "apscheduler>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "lxml>=5,<6",
    "openpyxl>=3.1,<4",
    "pdfplumber>=0.11,<1",
    "playwright==1.55.0",
    "psycopg[binary]>=3.2,<4",
    "pymupdf>=1.24,<2",
    "python-dotenv>=1,<2",
    "PyYAML>=6,<7",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "network: 실제 보험사 사이트를 호출하는 통합 테스트 (--run-network 필요)",
]

[tool.uv]
# 이 저장소는 기존 crawler/models/utils를 직접 import하는 애플리케이션이다.
# 패키지 빌드/설치는 하지 않고 uv가 의존성만 동기화한다.
package = false
